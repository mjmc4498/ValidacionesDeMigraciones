<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Script Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>SQL Script Generator</h1>
        <form id="sql-form">
            <div class="form-group">
                <label for="table">Table Name</label>
                <input type="text" id="table" name="table" required>
            </div>
            <div class="form-group">
                <label for="fields">Fields (comma separated)</label>
                <input type="text" id="fields" name="fields" required>
            </div>
            <div class="form-group">
                <label for="filter">Filter (optional)</label>
                <input type="text" id="filter" name="filter">
            </div>
            <div class="form-group">
                <label for="start_date">Start Date (optional)</label>
                <input type="date" id="start_date" name="start_date">
            </div>
            <div class="form-group">
                <label for="end_date">End Date (optional)</label>
                <input type="date" id="end_date" name="end_date">
            </div>
            <button type="submit">Generate Scripts</button>
        </form>
        <div id="results">
            <h2>Generated SQL Scripts</h2>
            <h3>Nulidad</h3>
            <pre><code id="nulidad-script"></code></pre>
            <h3>Totalidad</h3>
            <pre><code id="totalidad-script"></code></pre>
            <h3>Duplicados</h3>
            <pre><code id="duplicados-script"></code></pre>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
