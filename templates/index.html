<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <title>SQL Script Generator</title>
  </head>
  <body>
    <div class="container">
      <h1>SQL Script Generator</h1>
      <form action="/generate" method="post">
        <div class="mb-3">
          <label for="table" class="form-label">Table Name</label>
          <input type="text" class="form-control" id="table" name="table" required>
        </div>
        <div class="mb-3">
          <label for="fields" class="form-label">Fields (comma separated)</label>
          <input type="text" class="form-control" id="fields" name="fields" required>
        </div>
        <div class="mb-3">
          <label for="filter" class="form-label">Filter (optional)</label>
          <input type="text" class="form-control" id="filter" name="filter">
        </div>
        <div class="mb-3">
          <label for="start_date" class="form-label">Start Date (optional)</label>
          <input type="date" class="form-control" id="start_date" name="start_date">
        </div>
        <div class="mb-3">
          <label for="end_date" class="form-label">End Date (optional)</label>
          <input type="date" class="form-control" id="end_date" name="end_date">
        </div>
        <button type="submit" class="btn btn-primary">Generate Scripts</button>
      </form>
    </div>

    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
    -->
  </body>
</html>
